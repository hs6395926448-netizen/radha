# render.yaml — Render.com deployment configuration
# Push this to GitHub, connect repo on Render, and deploy in 2 minutes.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: slotify
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: slotify-db
          property: connectionString
        sync: false                  # Set manually in Render dashboard
        sync: false
      - key: BASE_URL
        sync: false                  # Set to your Render URL after first deploy

databases:
  - name: slotify-db
    databaseName: slotify
    user: slotify_user
    plan: free
